<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Organization — Contact</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="landing">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header site-header--editorial" role="banner">
    <div class="container container--narrow header-inner">
      <div class="brand">
        <a class="brand-link" href="index.html" aria-label="Organization home">
          <svg class="brand-mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" focusable="false">
            <rect x="1" y="1" width="20" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="wordmark-text">Organization</span>
        </a>
      </div>
      <nav class="main-nav" role="navigation" aria-label="Main navigation">
        <details class="nav-menu">
          <summary class="nav-toggle" aria-label="Toggle menu">&#9776;</summary>
          <ul id="nav-list" class="nav-list nav-list--editorial">
            <li><a href="index.html#overview">Overview</a></li>
            <li><a href="index.html#principles">Principles</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
          </ul>
        </details>
      </nav>
    </div>
  </header>

  <main id="main" class="container container--narrow">
    <section class="section-editorial section-editorial--contact">
      <h1 class="label">Contact</h1>
      <p class="body-copy">Share your question or request using the form below. We aim to reply within a reasonable time.</p>

      <form class="contact-form" method="get" action="contact.html">
        <div class="form-row">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required minlength="2" autocomplete="name" />
        </div>

        <div class="form-row">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required autocomplete="email" />
        </div>

        <div class="form-row">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" required>
            <option value="">Select a subject</option>
            <option value="general">General inquiry</option>
            <option value="information">Request for information</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-row">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required minlength="10"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn">Send message <svg class="ui-icon ui-icon--sm" aria-hidden="true"><use href="icons.svg#icon-mail"></use></svg></button>
          <button type="reset" class="btn secondary">Reset</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer site-footer--manifesto" role="contentinfo">
    <div class="container container--narrow">
      <p class="footer-manifesto">Clarity · Consistency · Consideration</p>
      <p class="footer-meta-line muted">
        Organization · 2026 ·
        <span class="footer-icons" aria-hidden="true">
          <svg class="ui-icon ui-icon--xs"><use href="icons.svg#icon-lock"></use></svg>
          <svg class="ui-icon ui-icon--xs"><use href="icons.svg#icon-document"></use></svg>
          <svg class="ui-icon ui-icon--xs"><use href="icons.svg#icon-accessibility"></use></svg>
        </span>
      </p>
    </div>
  </footer>
</body>
</html>
